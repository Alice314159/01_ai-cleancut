# 自动打包安卓 APK（调试签名，可直接安装测试）。
# 触发：手动运行（Actions → Android APK → Run workflow），或前端代码有改动时推送触发。
# 产物：在运行详情页底部的 Artifacts 下载 cleancut-android-apk（zip 内为 app-debug.apk）。
name: Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'frontend/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Capacitor 8 / Android Gradle Plugin 8.13 需要 JDK 21；GitHub 的 ubuntu 运行器已预装 Android SDK
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Build web app for Android
        run: npm run build:app

      - name: Sync web assets into the Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: frontend/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cleancut-android-apk
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
